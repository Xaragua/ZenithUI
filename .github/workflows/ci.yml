name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The stylesheet is generated by the BuildTailwind MSBuild target, which shells out to npm.
      # Node has to be present before `dotnet build`, not after.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/ZenithUI/package-lock.json

      - name: Restore npm packages
        working-directory: src/ZenithUI
        run: npm ci --no-audit --no-fund

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Fails the build on a contrast regression, an out-of-gamut token, or drift between the two
      # dark-palette blocks - see tests/ZenithUI.Tests/Theming/ThemeTokenTests.cs.
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Pack
        run: dotnet pack src/ZenithUI/ZenithUI.csproj --no-build --configuration Release --output ./artifacts

      - name: Verify the stylesheet made it into the package
        run: |
          set -euo pipefail
          package=$(ls ./artifacts/*.nupkg | head -1)
          # A .nupkg is a zip; static web assets live under staticwebassets/.
          # If the Tailwind target silently no-ops, the package still builds and still restores -
          # consumers just get an unstyled library. Catch that here rather than in their app.
          #
          # The path is matched exactly. rc.1.1 shipped zenith.css under content/wwwroot/ instead,
          # a looser grep passed it, and _content/ZenithUI/zenith.css 404'd in every consuming app:
          # a stylesheet generated after evaluation was never discovered as a static web asset.
          for sheet in zenith.css zenith.nopreflight.css; do
            if ! unzip -l "$package" | grep -qE "[[:space:]]staticwebassets/${sheet//./\\.}$"; then
              echo "::error::staticwebassets/$sheet is missing from $package - it will not be served at _content/ZenithUI/$sheet."
              unzip -l "$package"
              exit 1
            fi
            if unzip -l "$package" | grep -qE "[[:space:]]content(Files/[^ ]*)?/wwwroot/${sheet//./\\.}$"; then
              echo "::error::$sheet was packed as a content file - static web asset discovery missed it."
              unzip -l "$package"
              exit 1
            fi
            if ! unzip -p "$package" build/Microsoft.AspNetCore.StaticWebAssetEndpoints.props | grep -q "Include=\"_content/ZenithUI/$sheet\""; then
              echo "::error::No _content/ZenithUI/$sheet endpoint is declared in $package."
              exit 1
            fi
            echo "Found $sheet as a static web asset in $package"
          done

          # The consumer @theme and the targets file that delivers it. Without either, an app
          # running its own Tailwind restores a package that builds fine and compiles none of
          # ZenithUI's semantic utilities for its own markup - see docs/theming.md.
          # ZenithUI.lib.module.js is the Blazor JS initializer. Without it the theme silently
          # reverts on every enhanced navigation, which reads as "the switcher only themes one
          # page" and is not a component bug.
          # 'lib.module.js' without the ZenithUI prefix on purpose: static web assets are
          # content-hashed in the package, so the entry is ZenithUI.<hash>.lib.module.js.
          for required in 'tailwind/zenith.theme.css' 'build/ZenithUI.targets' 'buildTransitive/ZenithUI.targets' 'lib.module.js'; do
            if ! unzip -l "$package" | grep -q "$required"; then
              echo "::error::$required is missing from $package."
              unzip -l "$package"
              exit 1
            fi
            echo "Found $required in $package"
          done

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.nupkg
          if-no-files-found: error
