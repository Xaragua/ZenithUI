name: Release

# Publishing is deliberately tag-driven rather than push-driven: a merge to main should never
# publish, because a version number can never be reused once it reaches nuget.org.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Lets the job ask GitHub for the short-lived OIDC token that nuget.org exchanges for a
      # temporary API key. Without it NuGet/login fails with no token to present, and this is the
      # whole reason no secret has to be stored anywhere.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Node before dotnet build: the stylesheet and the consumer theme are generated by the
      # BuildTailwind target, which shells out to npm.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/ZenithUI/package-lock.json

      - name: Restore npm packages
        working-directory: src/ZenithUI
        run: npm ci --no-audit --no-fund

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The same suite CI runs. A release that skips the contrast audit and the ARIA tests is a
      # release nobody checked.
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      # The tag is the instruction; Directory.Build.props is the record. If they disagree, the
      # repository would not say what shipped - so stop rather than guess which one is right.
      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$version</Version> in Directory.Build.props."
            exit 1
          fi
          echo "Publishing $version"

      - name: Pack
        run: dotnet pack src/ZenithUI/ZenithUI.csproj --no-build --configuration Release --output ./artifacts

      # The same checks CI makes, repeated here because this is the copy that reaches the public.
      # A silently no-op Tailwind target still produces a package that builds and restores.
      - name: Verify the package contents
        run: |
          set -euo pipefail
          package=$(ls ./artifacts/*.nupkg | head -1)
          # Matched exactly: rc.1.1 shipped the stylesheets under content/ and 404'd everywhere.
          for sheet in zenith.css zenith.nopreflight.css; do
            if ! unzip -l "$package" | grep -qE "[[:space:]]staticwebassets/${sheet//./\\.}$" \
              || unzip -l "$package" | grep -qE "[[:space:]]content(Files/[^ ]*)?/wwwroot/${sheet//./\\.}$" \
              || ! unzip -p "$package" build/Microsoft.AspNetCore.StaticWebAssetEndpoints.props | grep -q "Include=\"_content/ZenithUI/$sheet\""; then
              echo "::error::$sheet is not packed as a static web asset served at _content/ZenithUI/$sheet."
              unzip -l "$package"
              exit 1
            fi
          done
          for required in 'tailwind/zenith.theme.css' 'build/ZenithUI.targets' 'buildTransitive/ZenithUI.targets' 'lib.module.js'; do
            if ! unzip -l "$package" | grep -q "$required"; then
              echo "::error::$required is missing from $package."
              unzip -l "$package"
              exit 1
            fi
          done
          echo "Package contents verified"

      # Exchanges the OIDC token for an API key valid for one hour. Done immediately before the
      # push for that reason - a key fetched at the start of a long job can expire before it is
      # used.
      #
      # The matching policy on nuget.org (username dropdown -> Trusted Publishing) has to hold the
      # values the OIDC token actually carries, and every one of them is a slug rather than a
      # label: Repository Owner is the GitHub account name, not the person's display name;
      # Repository is the bare name without the owner; Workflow File is the filename alone, not
      # its path; and Environment stays empty because this job declares none. A mismatch fails
      # here with a 401 and "No matching trust policy owned by user ... was found", which does not
      # say which field is wrong.
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.nupkg
          if-no-files-found: error
